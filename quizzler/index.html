<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 34 - Quizzler</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    /* This page matches the Tkinter app's own colours instead of the site theme */
    .quizzler {
      background: #375362;
      border-radius: 12px;
      padding: 2rem;
      font-family: Arial, sans-serif;
      max-width: 420px;
      margin: 1rem 0;
    }
    #score {
      text-align: right;
      color: white;
      font-size: 1rem;
      margin: 0 0 1rem;
    }
    #card {
      background: white;
      width: 300px;
      height: 250px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      box-sizing: border-box;
      transition: background 0.15s;
    }
    #card.right { background: green; }
    #card.wrong { background: red; }
    #question {
      color: #375362;
      font-size: 14pt;
      font-style: italic;
      text-align: center;
      margin: 0;
      user-select: none;
    }
    .buttons {
      display: flex;
      justify-content: space-around;
      margin-top: 2rem;
    }
    .buttons button {
      background: none; border: none; padding: 0; cursor: pointer;
    }
    .buttons button:disabled { opacity: 0.4; cursor: default; }
    .buttons img { width: 96px; height: auto; display: block; }
  </style>
</head>
<body>
  <main class="terminal">
    <div id="terminal-output">
      <p class="green" id="hint">Loading 10 computer-science questions from the Open Trivia Database...</p>
    </div>
    <div class="quizzler">
      <p id="score">Score: 0</p>
      <div id="card">
        <p id="question">Placeholder</p>
      </div>
      <div class="buttons">
        <button id="true" disabled title="True"><img src="images/true.png" alt="true"></button>
        <button id="false" disabled title="False"><img src="images/false.png" alt="false"></button>
      </div>
    </div>
    <p class="footer-links">
      <a href="../">← all days</a> ·
      <a href="https://github.com/joankhng/python-bootcamp/blob/main/quizzler/main.py">view the Python code</a>
    </p>
  </main>
  <script src="index.js"></script>
</body>
</html>
